<form action="/language" method="post" class="language-form">
  <input type="hidden" name="return_to" value="{{ language_return }}">
  <label for="{{ 'settings-language' if in_settings else 'auth-language' }}">{{ t('표시 언어') }}</label>
  <select id="{{ 'settings-language' if in_settings else 'auth-language' }}" name="language" data-language-select aria-label="{{ t('언어를 선택하세요') }}">
    <option value="ko" {% if lang == 'ko' %}selected{% endif %}>{{ t('한국어') }}</option>
    <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
  </select>
  <button class="secondary" type="submit">{{ t('적용') }}</button>
</form>
