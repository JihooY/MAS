[project]
name = "music-analysis-studio"
version = "0.1.0"
description = "Local vocal comparison studio with NumPy analysis and MongoDB over SSH"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20", "pydantic-settings>=2.8,<3",
  "numpy>=2.1,<3", "scipy>=1.14,<2", "librosa>=0.11,<1",
  "soundfile>=0.13,<1", "pymongo>=4.11,<5", "httpx>=0.28,<1",
  "imageio-ffmpeg>=0.6,<1",
  "jinja2>=3.1.6,<4",
  "markdown-it-py>=3,<5", "bleach>=6.2,<7",
  "demucs==4.0.1", "torch>=2.6,<2.9", "torchaudio>=2.6,<2.9",
]

[dependency-groups]
dev = ["pytest>=8,<10", "mongomock>=4.3,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
